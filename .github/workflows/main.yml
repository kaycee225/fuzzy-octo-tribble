name: Torrent Download & Smart Upload to Pixeldrain (Libtorrent Optimized)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      PIXELDRAIN_API_KEY: '1890d8a2-9099-4484-8238-fe667dbfd6bd'
      FOLDER_PATH: 'downloaded_files'
      PAGE_URL: 'https://pink-script-snap.lovable.app/api/public/page/ce6c23ca-89a3-4ce6-afdd-1f13ea0655a5.txt'
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install python3-libtorrent jq curl -y

      - name: Supercharged Libtorrent Download
        run: |
          python3 - << 'EOF'
          import libtorrent as lt
          import time
          import urllib.request
          import os
          import shutil

          # --- ADVANCED TUNING FOR LOW SEEDS ---
          # We configure the session to be extremely aggressive in finding peers
          # and very patient with slow/weak connections.
          settings = {
              'listen_interfaces': '0.0.0.0:6881',
              'enable_dht': True,
              'enable_pex': True,
              'enable_lsd': True,
              'connections_limit': 1000,
              'peer_timeout': 240,       # Wait up to 4 mins before dropping a dead peer
              'inactivity_timeout': 600, # Allow peers to idle longer if they are slow
              'request_timeout': 30,     # Give slow peers more time to send blocks
              'auto_manage_prefer_seeds': True,
              'strict_end_game_mode': False
          }
          ses = lt.session(settings)
          
          save_path = os.environ.get('FOLDER_PATH', 'downloaded_files')
          os.makedirs(save_path, exist_ok=True)
          
          url = os.environ.get('PAGE_URL')
          added_links = set()
          handles = []
          
          # 1. Fetch live trackers to inject into magnets for immediate peering
          print("🌐 Fetching live tracker list to boost low-seed discovery...")
          try:
              req = urllib.request.Request("https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best.txt", headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  trackers = [t for t in response.read().decode('utf-8').split('\n') if t.strip()]
              print(f"✅ Loaded {len(trackers)} live trackers.")
          except Exception as e:
              print("⚠️ Could not load trackers, falling back to DHT.")
              trackers = []

          print("🚀 Starting Libtorrent engine & dynamic fetcher...")

          while True:
              # 2. Fetch Control Page
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req) as response:
                      lines = [l.strip() for l in response.read().decode('utf-8').split('\n') if l.strip()]
              except Exception as e:
                  print(f"⚠️ Failed to fetch page: {e}")
                  lines = []
                  
              lines_lower = [l.lower() for l in lines]
              
              # 3. Global Kill Switch
              if "STOP.ALL.TORRENTS" in lines:
                  print("🛑 Global kill switch 'STOP.ALL.TORRENTS' detected! Halting.")
                  break
                  
              # 4. Add New Magnets & Inject Trackers
              for line in lines:
                  if line.startswith("magnet:") and line not in added_links:
                      print(f"📥 New magnet link detected! Adding to session...")
                      params = lt.parse_magnet_uri(line)
                      params.save_path = save_path
                      
                      # Inject the live trackers directly into the torrent
                      for tr in trackers:
                          params.trackers.append(tr)
                          
                      handle = ses.add_torrent(params)
                      handles.append(handle)
                      added_links.add(line)
                      
              # 5. Process Status & Specific Kill Switches
              all_done = True if handles else False
              active_handles = []
              state_str = ['queued', 'checking', 'downloading metadata', 'downloading', 'finished', 'seeding', 'allocating', 'checking fastresume']
              
              for h in handles:
                  s = h.status()
                  name = s.name if s.name else "Resolving Metadata..."
                  
                  # Specific Kill Switch
                  if name != "Resolving Metadata...":
                      if f"{name.lower()} no" in lines_lower or f"no {name.lower()}" in lines_lower:
                          print(f"🛑 Specific stop triggered for '{name}'. Removing files...")
                          ses.remove_torrent(h)
                          
                          target_path = os.path.join(save_path, name)
                          if os.path.exists(target_path):
                              if os.path.isdir(target_path): shutil.rmtree(target_path)
                              else: os.remove(target_path)
                          continue
                          
                  active_handles.append(h)
                  
                  if s.progress >= 1.0:
                      h.pause() # Stop seeding when 100% to save CI time
                  else:
                      all_done = False
                      
                  # Report Progress with Peer count
                  if name != "Resolving Metadata...":
                      current_state = state_str[int(s.state)] if int(s.state) < len(state_str) else str(s.state)
                      print(f"📥 {name} | Prog: {s.progress * 100:.1f}% | Peers: {s.num_peers} | Seeds: {s.num_seeds} | {current_state}")
                  else:
                      print("📥 Resolving magnet metadata... (Finding peers)")
                      
              handles = active_handles
              
              if handles and all_done:
                  print("✅ All active downloads completed naturally!")
                  break
                  
              time.sleep(10)

          # Final cleanup for incomplete files if Global Kill Switch was hit
          for h in handles:
              if h.status().progress < 1.0:
                  name = h.status().name if h.status().name else "Unknown"
                  print(f"❌ Removing incomplete global download: {name}")
                  ses.remove_torrent(h)
                  if name != "Unknown":
                      target_path = os.path.join(save_path, name)
                      if os.path.exists(target_path):
                          if os.path.isdir(target_path): shutil.rmtree(target_path)
                          else: os.remove(target_path)
          EOF

      - name: Upload files to Pixeldrain
        run: |
          find "$FOLDER_PATH" -type f | sort | while read -r FILE; do
              if [[ "$FILE" == *".!qB"* || "$FILE" == *".part"* ]]; then
                  continue
              fi

              FILENAME=$(basename "$FILE")
              
              FILE_SIZE_BYTES=$(stat -c%s "$FILE")
              FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE_BYTES/1024/1024}")
              
              echo "Uploading: $FILE ($FILE_SIZE_MB MB)"
              
              # Upload via Pixeldrain API with basic auth using the API key
              RESPONSE=$(curl -s -u ":$PIXELDRAIN_API_KEY" -T "$FILE" "https://pixeldrain.com/api/file/")
              
              if echo "$RESPONSE" | jq -e . >/dev/null 2>&1; then
                  success=$(echo "$RESPONSE" | jq -r '.success')
                  if [ "$success" != "true" ]; then
                      echo "❌ Failed to upload $FILENAME: $(echo "$RESPONSE" | jq -r '.message')"
                  else
                      FILE_ID=$(echo "$RESPONSE" | jq -r '.id')
                      echo "✅ Successfully uploaded: $FILENAME"
                      echo "🔗 Download Link: https://pixeldrain.com/u/$FILE_ID"
                  fi
              else
                  echo "❌ Server returned an invalid response (not JSON)."
                  echo "Raw Server Response:"
                  echo "$RESPONSE"
              fi
          done
